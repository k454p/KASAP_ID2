<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kasapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#kasapGrad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Shopping bag icon & cart elements -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Bag handles -->
    <path d="M 85 110 C 85 45, 215 45, 215 110" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    
    <!-- Bag body -->
    <rect x="40" y="105" width="220" height="240" rx="28" fill="#ffffff" />
    
    <!-- Letter K / Cart Emblem -->
    <path d="M 95 160 L 95 285 M 95 225 L 175 160 M 120 205 L 185 285" fill="none" stroke="#047857" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Gold badge / Star -->
    <circle cx="215" cy="295" r="34" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6" />
    <path d="M 215 273 L 221 288 L 237 288 L 224 298 L 229 313 L 215 303 L 201 313 L 206 298 L 193 288 L 209 288 Z" fill="#ffffff" />
  </g>

  <!-- App Label in base -->
  <text x="256" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">KASAP_ID</text>
</svg>
